<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b0c0f"><title>iPhone Business</title>
<style>
:root{color-scheme:dark;--bg:#0b0c0f;--panel:#14161b;--line:#ffffff12;--muted:#858995;--purple:#b6a5ff;--green:#8ce0b2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f4f7;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:520px;min-height:100dvh;margin:auto;padding-bottom:calc(84px + env(safe-area-inset-bottom));overflow:hidden}.top{height:72px;padding:0 20px;display:flex;align-items:center;gap:11px;border-bottom:1px solid #ffffff0b}.logo{height:38px;width:38px;display:grid;place-items:center;border-radius:13px;color:var(--purple);background:#252033;border:1px solid #b6a5ff25;font-size:20px}.brand{flex:1}.brand b{display:block;font-size:15px;letter-spacing:-.3px}.brand small{font-size:9px;letter-spacing:1.6px;color:#858995}.bell{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px;font-size:16px}.content{padding:23px 18px;animation:page .22s ease-out}.kicker{margin:0;color:var(--muted);font-size:10px;letter-spacing:1.2px;font-weight:700}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:29px;letter-spacing:-1px;margin:5px 0 0}.pill{border:1px solid var(--line);border-radius:99px;padding:7px 9px;font-size:10px;color:#aaa}.profit{border:1px solid var(--line);border-radius:22px;padding:19px;background:radial-gradient(ellipse at 100% 0,#7160b333,transparent 55%),linear-gradient(145deg,#1b1c23,#131419)}.between{display:flex;justify-content:space-between;align-items:center;color:#a5a8b3;font-size:12px}.period{font-size:9px;letter-spacing:1px;color:#858995}.big{font-size:37px;font-weight:800;letter-spacing:-1.7px;margin:10px 0 4px}.change{color:var(--green);font-size:11px}.chart{height:75px;display:flex;align-items:end;gap:4px;margin-top:22px;border-bottom:1px solid var(--line)}.chart i{display:block;flex:1;border-radius:4px 4px 0 0;background:linear-gradient(#b6a5ff,#6755a8);animation:grow .5s ease-out both;transform-origin:bottom}.chart i:nth-child(2n){animation-delay:30ms}.labels{display:flex;justify-content:space-between;font-size:9px;color:#707480;padding-top:8px}.section{display:flex;align-items:center;justify-content:space-between;margin:25px 1px 12px}.section h2{font-size:15px;margin:0}.muted{color:var(--muted);font-size:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:13px;animation:rise .35s ease-out both}.stat:nth-child(2){animation-delay:40ms}.stat:nth-child(3){animation-delay:80ms}.stat:nth-child(4){animation-delay:120ms}.ico{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#29233d;color:var(--purple);margin-bottom:10px}.stat label{display:block;color:#9295a0;font-size:10px}.stat strong{display:block;font-size:21px;letter-spacing:-.6px;margin-top:5px;white-space:nowrap}.stat strong small{font-size:10px;color:#858995;font-weight:500}.stat p{margin:5px 0 0;color:#777b87;font-size:9px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.actions button{border:1px solid var(--line);background:#121419;border-radius:14px;padding:12px 2px;display:flex;align-items:center;flex-direction:column;gap:8px;color:#d1d2d8;font-size:10px;transition:transform .18s,background .18s}.actions button:active,.nav button:active{transform:scale(.95)}.actionico{width:33px;height:33px;display:grid;place-items:center;border-radius:11px;background:#1d3329;color:var(--green);font-size:17px}.actionico.p{background:#29233d;color:var(--purple)}.actionico.o{background:#37291e;color:#e7b985}.rows{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:0 12px}.row{min-height:64px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ffffff0b}.row:last-child{border:0}.round{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#1d3329;color:var(--green)}.round.red{background:#392326;color:#e7a7a7}.rowcopy{flex:1;min-width:0}.rowcopy b{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowcopy small{font-size:9px;color:#858995;display:block;margin-top:4px}.amount{font-size:11px;font-weight:700;white-space:nowrap}.positive{color:var(--green)}.note{text-align:center;color:#646873;font-size:9px;line-height:1.5;margin:17px 10px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(5,1fr);padding:10px 7px calc(9px + env(safe-area-inset-bottom));background:#111216ed;backdrop-filter:blur(22px);border-top:1px solid var(--line)}.nav button{background:none;border:0;color:#777b87;display:flex;align-items:center;flex-direction:column;gap:5px;font-size:9px;padding:4px 0;transition:color .18s,transform .18s}.nav button.active{color:var(--purple)}.stocksummary,.balance{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.stocksummary span,.balance span{display:block;color:var(--muted);font-size:10px;margin-bottom:7px}.stocksummary b{font-size:14px}.search{width:100%;height:43px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:0 12px;color:white;outline:none;margin-bottom:10px}.phone{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.phoneart{width:58px;height:70px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#34332f,#191a1e);font-size:25px;color:#c6bca9}.phoneinfo{flex:1;min-width:0}.phoneinfo b,.phoneinfo span,.phoneinfo small,.phoneinfo strong{display:block}.phoneinfo b{font-size:12px}.phoneinfo span{font-size:9px;color:#a0a3ad;margin:5px 0}.phoneinfo small{font-size:9px;color:#777b87}.phoneinfo strong{font-size:11px;margin-top:5px}.typebtn,.setting{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:13px;display:flex;align-items:center;gap:12px;text-align:left;margin-bottom:8px;color:#eee}.typebtn span:last-child,.setting span:nth-child(2){flex:1}.balance{display:block;padding:19px}.balance strong{display:block;font-size:29px;margin:8px 0 18px}.split{border-top:1px solid var(--line);padding-top:13px;display:flex;justify-content:space-between;font-size:11px}.toast{position:fixed;top:83px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:470px;border:1px solid #b6a5ff33;background:#252130;color:#e2dcff;padding:13px 14px;border-radius:13px;font-size:12px;box-shadow:0 10px 30px #0007;animation:page .18s ease-out;z-index:4}.primary{background:var(--purple);color:#191523;border:0;border-radius:11px;padding:10px 12px;font-weight:700;font-size:11px}.empty{padding:32px 10px;text-align:center;color:#888;font-size:12px}@keyframes page{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@keyframes grow{from{transform:scaleY(.1);opacity:.2}to{transform:scaleY(1);opacity:.85}}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}@media(min-width:600px){body{padding:20px 0;background:#07080a}.app{border:1px solid var(--line);border-radius:25px;min-height:calc(100dvh - 40px)}.nav{bottom:20px;border-radius:0 0 25px 25px}}
</style></head>
<body><main class="app"><header class="top"><div class="logo">▣</div><div class="brand"><small>PERSONAL BUSINESS</small><b>iPhone Business</b></div><button class="bell" onclick="notice('Уведомления подключим после настройки сервера.')" aria-label="Уведомления">♧</button></header><section class="content" id="content"></section><nav class="nav" id="nav"></nav></main><script>
const tabs=[['Главная','⌂'],['Склад','▤'],['Операции','⇄'],['Финансы','◉'],['Ещё','⚙']];let active='Главная',query='';const phones=[['iPhone 15 Pro','256 ГБ · 86% · Natural Titanium','38 000 ₽','2 дня'],['iPhone 13','128 ГБ · 89% · Midnight','19 500 ₽','5 дней'],['iPhone 14 Pro','128 ГБ · 84% · Space Black','31 000 ₽','8 дней']];function notice(t){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),2600)}function heading(k,t,extra=''){return `<div class="head"><div><p class="kicker">${k}</p><h1>${t}</h1></div>${extra}</div>`}function section(t,r=''){return `<div class="section"><h2>${t}</h2><span class="muted">${r}</span></div>`}function row(icon,title,sub,amount,red=false){return `<div class="row"><span class="round ${red?'red':''}">${icon}</span><span class="rowcopy"><b>${title}</b><small>${sub}</small></span><span class="amount ${!red?'positive':''}">${amount}</span></div>`}function home(){return `${heading('СРЕДА, 14 ОКТЯБРЯ','Главная','<span class="pill">● Личный учёт</span>')}<section class="profit"><div class="between"><span>Прибыль за месяц</span><span class="period">ОКТЯБРЬ⌄</span></div><div class="big">86 400 ₽</div><div class="change">↗ +12 400 ₽ <span style="color:#858995">к прошлому месяцу</span></div><div class="chart">${[28,43,35,62,47,75,56,88,66,100,77,91,68,84,72,96,81,100,73,88].map((v,i)=>`<i style="height:${v}%;animation-delay:${i*15}ms"></i>`).join('')}</div><div class="labels"><span>1 окт.</span><span>7 окт.</span><span>14 окт.</span><span>Сегодня</span></div></section>${section('Обзор','Этот месяц')}<div class="stats"><article class="stat"><span class="ico">▤</span><label>На складе</label><strong>3 <small>шт.</small></strong><p>Стоимость 88 500 ₽</p></article><article class="stat"><span class="ico" style="color:#8ce0b2;background:#1c342a">◉</span><label>Деньги в обороте</label><strong>142 300 <small>₽</small></strong><p>Наличные и карта</p></article><article class="stat"><span class="ico" style="color:#89c6ff;background:#1b2d3e">↗</span><label>Продажи</label><strong>8 <small>сделок</small></strong><p>За текущий месяц</p></article><article class="stat"><span class="ico" style="color:#e7b985;background:#37291e">✧</span><label>Средняя прибыль</label><strong>10 800 <small>₽</small></strong><p>С обычной продажи</p></article></div>${section('Быстрые действия')}<div class="actions"><button onclick="go('Операции')"><span class="actionico">↙</span>Закупка</button><button onclick="go('Операции')"><span class="actionico">↗</span>Продажа</button><button onclick="go('Операции')"><span class="actionico p">⇄</span>Обмен</button><button onclick="go('Операции')"><span class="actionico o">▣</span>Расход</button></div>${section('Последние операции','Все')}<div class="rows">${row('↗','Продажа iPhone 15 Pro','Сегодня, 12:42','+9 000 ₽')}${row('↙','Закупка iPhone 13','Вчера, 18:20','−19 500 ₽',true)}${row('⇄','Обмен iPhone 14 Pro','12 октября','+6 500 ₽')}</div><p class="note">Демонстрационные данные · пока не подключены к базе</p>`}function stock(){let p=phones.filter(x=>x.join(' ').toLowerCase().includes(query.toLowerCase()));return `${heading('УЧЁТ УСТРОЙСТВ','Склад','<button class="primary" onclick="notice(\'Добавление телефона подключим следующим этапом.\')">＋ Добавить</button>')}<div class="stocksummary"><div><span>Телефонов в наличии</span><b>3 устройства</b></div><div><span>Общая себестоимость</span><b>88 500 ₽</b></div></div><input class="search" placeholder="⌕  Поиск по модели, памяти..." value="${query}" oninput="query=this.value;render()">${p.length?p.map((x,i)=>`<div class="phone"><div class="phoneart">▯</div><div class="phoneinfo"><b>${x[0]}</b><span>${x[1]}</span><small>В наличии · ${x[3]} назад</small><strong>${x[2]}</strong></div><span style="color:#777">›</span></div>`).join(''):'<div class="empty">Ничего не найдено</div>'}<p class="note">Демонстрационные данные · изменения пока не сохраняются</p>`}function operations(){return `${heading('ИСТОРИЯ ДВИЖЕНИЙ','Операции')}<button class="typebtn" onclick="notice('Форма закупки будет следующим этапом.')"><span class="actionico">↙</span><span>Закупка</span>›</button><button class="typebtn" onclick="notice('Форма продажи подключится к складу.')"><span class="actionico">↗</span><span>Продажа</span>›</button><button class="typebtn" onclick="notice('Форму обмена добавим после финансовой логики.')"><span class="actionico p">⇄</span><span>Обмен</span>›</button><button class="typebtn" onclick="notice('Форма расходов появится в следующем этапе.')"><span class="actionico o">▣</span><span>Расход</span>›</button>${section('История','Октябрь 2026')}<div class="rows">${row('↗','Продажа iPhone 15 Pro','14 октября · Продажа','+9 000 ₽')}${row('↙','Закупка iPhone 13','13 октября · Закупка','−19 500 ₽',true)}</div><p class="note">История будет формироваться из реальных операций после подключения API.</p>`}function finance(){return `${heading('ДЕНЕЖНЫЙ ПОТОК','Финансы')}<div class="balance"><span>Общий денежный баланс</span><strong>142 300 ₽</strong><div class="split"><span>Наличные <b>52 300 ₽</b></span><span>Карта <b>90 000 ₽</b></span></div></div><div class="stats"><article class="stat"><label>Стоимость склада</label><strong>88 500 <small>₽</small></strong></article><article class="stat"><label>Общий капитал</label><strong>230 800 <small>₽</small></strong></article></div>${section('Прибыль по месяцам','2026')}<div class="profit" style="display:flex;gap:20px;align-items:end;height:170px;justify-content:space-around">${[['Июл',42],['Авг',58],['Сен',70],['Окт',86]].map(([m,h])=>`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:8px"><b style="font-size:10px;color:#b6a5ff">${h}к</b><i style="height:${h}%;width:25px;border-radius:5px 5px 2px 2px;background:linear-gradient(#b6a5ff,#6755a8);animation:grow .4s"></i><span class="muted">${m}</span></div>`).join('')}</div><p class="note">Все суммы на этом экране — пример оформления, не реальные данные.</p>`}function more(){return `${heading('ПРИЛОЖЕНИЕ','Ещё')}${[['◉','Счета и баланс','Наличные, карта и другие счета'],['♧','Напоминания','Склад, ремонт и контакты'],['⇩','Экспорт данных','Выгрузка операций в CSV'],['⚙','Настройки учёта','Начальный баланс и параметры']].map(x=>`<button class="setting" onclick="notice('Этот раздел подключим после основных операций.')"><span class="actionico p">${x[0]}</span><span><b>${x[1]}</b><small style="display:block;color:#858995;margin-top:4px">${x[2]}</small></span>›</button>`).join('')}<div style="text-align:center;padding:35px;color:#777;font-size:11px">iPhone Business<br><br>Версия 0.1 · Каркас приложения</div>`}function render(){document.getElementById('content').innerHTML=({'Главная':home,'Склад':stock,'Операции':operations,'Финансы':finance,'Ещё':more})[active]();document.getElementById('nav').innerHTML=tabs.map(([t,i])=>`<button class="${active===t?'active':''}" onclick="go('${t}')"><span style="font-size:18px">${i}</span>${t}</button>`).join('')}function go(t){active=t;query='';render();window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
