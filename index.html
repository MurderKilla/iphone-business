<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101419"><title>iPhone Business</title>
<style>

x}.period{background:#ffffff08;border:1px solid var(--line);border-radius:10px;padding:7px 9px;color:#c5d0d8;font-size:11px}.big{font-size:38px;line-height:1.2;font-weight:650;letter-spacing:-1.5px;margin:13px 0 6px}.change{display:flex;align-items:center;gap:6px;color:var(--mint);font-size:12px;font-weight:550}.change svg{width:15px;height:15px}.change span{color:var(--muted);font-weight:450}.chart{height:83px;display:flex;align-items:end;gap:5px;margin-top:22px;border-bottom:1px solid #ffffff16}.chart i{display:block;flex:1;border-radius:5px 5px 0 0;background:linear-gradient(#a6d9c9,#5e9e91);opacity:.9;animation:grow .55s ease-out both;transform-origin:bottom}.chart i:nth-child(3n){opacity:.55}.labels{display:flex;justify-content:space-between;color:var(--subtle);font-size:10px;padding-top:9px}.section{display:flex;align-items:center;justify-content:space-between;margin:27px 2px 13px}.section h2{font-size:17px;letter-spacing:-.25px;font-weight:620;margin:0}.muted{color:var(--muted);font-size:11px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:11px}.stat{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:15px 14px;min-width:0;animation:rise .35s ease-out both}.stat:nth-child(2){animation-delay:40ms}.stat:nth-child(3){animation-delay:80ms}.stat:nth-child(4){animation-delay:120ms}.ico{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:#273a39;color:var(--mint);margin-bottom:13px}.ico svg{width:22px;height:22px;stroke-width:1.8}.ico.blue{background:#27354a;color:var(--blue)}.ico.amber{background:#3a3329;color:var(--amber)}.ico.violet{background:#343147;color:#c2b7f0}.stat label{display:block;color:#a4afba;font-size:12px;font-weight:500}.stat strong{display:block;font-size:22px;line-height:1.2;font-weight:650;letter-spacing:-.55px;margin-top:7px;white-space:nowrap}.stat strong small{font-size:12px;color:var(--muted);font-weight:500}.stat p{margin:7px 0 0;color:var(--subtle);font-size:11px}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.actions button{min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:17px;padding:13px 3px 12px;display:flex;align-items:center;flex-direction:column;gap:9px;color:#d7dfe5;font-size:11px;font-weight:550;transition:transform .18s,background .18s}.actions button:active,.nav button:active{transform:scale(.96)}.actionico{width:40px;height:40px;display:grid;place-items:center;border-radius:14px;background:#273a39;color:var(--mint)}.actionico svg{width:22px;height:22px;stroke-width:1.9}.actionico.blue{background:#27354a;color:var(--blue)}.actionico.amber{background:#3a3329;color:var(--amber)}.actionico.violet{background:#343147;color:#c2b7f0}.rows{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:0 13px}.row{min-height:72px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ffffff0c}.row:last-child{border:0}.round{width:40px;height:40px;flex:0 0 40px;border-radius:14px;display:grid;place-items:center;background:#273a39;color:var(--mint)}.round svg{width:21px;height:21px}.round.red{background:#392a2d;color:var(--red)}.rowcopy{flex:1;min-width:0}.rowcopy b{font-size:13px;font-weight:570;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowcopy small{font-size:11px;color:var(--muted);display:block;margin-top:4px}.amount{font-size:13px;font-weight:650;white-space:nowrap}.positive{color:var(--mint)}.note{text-align:center;color:var(--subtle);font-size:10px;line-height:1.5;margin:19px 10px}.nav{position:fixed;z-index:3;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(5,1fr);padding:11px 8px calc(10px + env(safe-area-inset-bottom));background:#151b20ed;backdrop-filter:blur(24px);border-top:1px solid var(--line)}.nav button{background:none;border:0;color:#7e8a96;display:flex;align-items:center;flex-direction:column;gap:5px;font-size:10px;font-weight:520;padding:4px 0;transition:color .18s,transform .18s}.nav button svg{width:23px;height:23px;stroke-width:1.8}.nav button.active{color:var(--mint)}.stocksummary,.balance{border:1px solid var(--line);background:var(--panel);border-radius:19px;padding:17px;display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:15px}.stocksummary span,.balance span{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.stocksummary b{font-size:15px;font-weight:620}.search{width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:0 14px;color:white;outline:none;margin-bottom:11px;font-size:14px}.search:focus{border-color:#8ed8c066}.phone{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid var(--line)}.phoneart{width:61px;height:76px;flex:0 0 61px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#343e43,#222a30);color:#c5d0d8}.phoneart svg{width:34px;height:46px;stroke-width:1.4}.phoneinfo{flex:1;min-width:0}.phoneinfo b,.phoneinfo span,.phoneinfo small,.phoneinfo strong{display:block}.phoneinfo b{font-size:14px;font-weight:620}.phoneinfo span{font-size:11px;color:#a4afba;margin:5px 0}.phoneinfo small{font-size:11px;color:var(--muted)}.phoneinfo strong{font-size:13px;font-weight:650;margin-top:7px}.chev{color:#7f8c98}.typebtn,.setting{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:17px;padding:14px;display:flex;align-items:center;gap:13px;text-align:left;margin-bottom:9px;color:#eee;min-height:68px}.typebtn span:nth-child(2),.setting span:nth-child(2){flex:1}.typebtn b,.setting b{font-size:14px;font-weight:600}.typebtn .desc,.setting small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.balance{display:block;padding:20px}.balance strong{display:block;font-size:31px;letter-spacing:-.8px;font-weight:650;margin:8px 0 19px}.split{border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:10px;font-size:12px}.split b{color:#e4eaf0;font-weight:600}.primary{background:var(--mint);color:#14221f;border:0;border-radius:13px;padding:11px 13px;font-weight:650;font-size:12px;white-space:nowrap}.empty{padding:32px 10px;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;z-index:5;top:88px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:470px;border:1px solid #8ed8c033;background:#263632;color:#e1f5ee;padding:14px 15px;border-radius:15px;font-size:13px;box-shadow:0 10px 30px #0007;animation:appear .18s ease-out}.morebrand{text-align:center;padding:34px;color:var(--subtle);font-size:11px}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@keyframes grow{from{transform:scaleY(.12);opacity:.2}to{transform:scaleY(1);opacity:.9}}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}@media(min-width:600px){body{padding:20px 0;background:#0b0f12}.app{border:1px solid var(--line);border-radius:27px;min-height:calc(100dvh - 40px)}.nav{bottom:20px;border-radius:0 0 27px 27px}}
</style></head><body><main class="app"><header class="top"><div class="logo" id="logo"></div><div class="brand"><small>PERSONAL BUSINESS</small><b>iPhone Business</b></div><button class="iconbtn" onclick="notice('Уведомления подключим после настройки сервера.')" aria-label="Уведомления" id="bell"></button></header><section class="content" id="content"></section><nav class="nav" id="nav"></nav></main><script>
const paths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',stock:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h3"/>',ops:'<path d="M7 7h13l-3-3M17 17H4l3 3"/><path d="M20 7v4M4 17v-4"/>',finance:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M7 15h4"/><path d="M7 5V3h10v2"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',phone:'<rect x="5" y="2" width="14" height="20" rx="3"/><path d="M10 5h4M11 18h2"/>',cash:'<rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="3"/><path d="M7 9h.01M17 16h.01"/>',trend:'<path d="m3 17 6-6 4 4 8-9"/><path d="M15 6h6v6"/>',box:'<path d="m12 3 9 5-9 5-9-5z"/><path d="M3 8v9l9 5 9-5V8M12 13v9"/>',swap:'<path d="m16 3 4 4-4 4M20 7H4M8 21l-4-4 4-4M4 17h16"/>',expense:'<path d="M12 3v18M5 12h14"/><circle cx="12" cy="12" r="9"/>',chevron:'<path d="m9 18 6-6-6-6"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5"/><path d="M4 17v3h16v-3"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.6a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.6-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.6a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.6 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<path d="m5 12 4 4L19 6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>'};function icon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]||paths.phone}</svg>`}
document.getElementById('logo').innerHTML=icon('phone');document.getElementById('bell').innerHTML=icon('bell');const tabs=[['Главная','home'],['Склад','stock'],['Операции','ops'],['Финансы','finance'],['Ещё','more']];let active='Главная',query='';const phones=[['iPhone 15 Pro','256 ГБ · Аккумулятор 86%','38 000 ₽','2 дня'],['iPhone 13','128 ГБ · Аккумулятор 89%','19 500 ₽','5 дней'],['iPhone 14 Pro','128 ГБ · Аккумулятор 84%','31 000 ₽','8 дней']];function notice(t){document.querySelector('.toast')?.remove();let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),2600)}function heading(k,t,extra=''){return `<div class="head"><div><p class="kicker">${k}</p><h1>${t}</h1></div>${extra}</div>`}function section(t,r=''){return `<div class="section"><h2>${t}</h2><span class="muted">${r}</span></div>`}function row(ic,title,sub,amount,red=false){return `<div class="row"><span class="round ${red?'red':''}">${icon(ic)}</span><span class="rowcopy"><b>${title}</b><small>${sub}</small></span><span class="amount ${!red?'positive':''}">${amount}</span></div>`}function home(){return `${heading('СРЕДА, 14 ОКТЯБРЯ','Главная','<span class="pill">● Личный учёт</span>')}<section class="profit"><div class="between"><span>Прибыль за месяц</span><span class="period">ОКТЯБРЬ⌄</span></div><div class="big">86 400 ₽</div><div class="change">${icon('trend')} +12 400 ₽ <span>к прошлому месяцу</span></div><div class="chart">${[28,43,35,62,47,75,56,88,66,100,77,91,68,84,72,96,81,100,73,88].map((v,i)=>`<i style="height:${v}%;animation-delay:${i*15}ms"></i>`).join('')}</div><div class="labels"><span>1 окт.</span><span>7 окт.</span><span>14 окт.</span><span>Сегодня</span></div></section>${section('Обзор','Этот месяц')}<div class="stats"><article class="stat"><span class="ico">${icon('phone')}</span><label>На складе</label><strong>3 <small>шт.</small></strong><p>Стоимость 88 500 ₽</p></article><article class="stat"><span class="ico blue">${icon('cash')}</span><label>Свободные деньги</label><strong>142 300 <small>₽</small></strong><p>Наличные и карта</p></article><article class="stat"><span class="ico violet">${icon('trend')}</span><label>Продажи</label><strong>8 <small>сделок</small></strong><p>За текущий месяц</p></article><article class="stat"><span class="ico amber">${icon('box')}</span><label>В товаре</label><strong>88 500 <small>₽</small></strong><p>Себестоимость склада</p></article></div>${section('Быстрые действия')}<div class="actions"><button onclick="go('Операции')"><span class="actionico">${icon('box')}</span>Закупка</button><button onclick="go('Операции')"><span class="actionico blue">${icon('trend')}</span>Продажа</button><button onclick="go('Операции')"><span class="actionico violet">${icon('swap')}</span>Обмен</button><button onclick="go('Операции')"><span class="actionico amber">${icon('expense')}</span>Расход</button></div>${section('Последние операции','Все')}<div class="rows">${row('trend','Продажа iPhone 15 Pro','Сегодня, 12:42','+9 000 ₽')}${row('box','Закупка iPhone 13','Вчера, 18:20','−19 500 ₽',true)}${row('swap','Обмен iPhone 14 Pro','12 октября','+6 500 ₽')}</div><p class="note">Демонстрационные данные · пока не подключены к базе</p>`}function stock(){let p=phones.filter(x=>x.join(' ').toLowerCase().includes(query.toLowerCase()));return `${heading('УЧЁТ УСТРОЙСТВ','Склад','<button class="primary" onclick="notice(\'Добавление телефона подключим следующим этапом.\')">＋ Добавить</button>')}<div class="stocksummary"><div><span>Телефонов в наличии</span><b>3 устройства</b></div><div><span>Общая себестоимость</span><b>88 500 ₽</b></div></div><input class="search" placeholder="⌕  Поиск по модели, памяти..." value="${query}" oninput="query=this.value;render()">${p.length?p.map(x=>`<div class="phone"><div class="phoneart">${icon('phone')}</div><div class="phoneinfo"><b>${x[0]}</b><span>${x[1]}</span><small>В наличии · ${x[3]} назад</small><strong>${x[2]}</strong></div><span class="chev">${icon('chevron')}</span></div>`).join(''):'<div class="empty">Ничего не найдено</div>'}<p class="note">Демонстрационные данные · изменения пока не сохраняются</p>`}function operations(){return `${heading('ИСТОРИЯ ДВИЖЕНИЙ','Операции')}<button class="typebtn" onclick="notice('Форма закупки будет следующим этапом.')"><span class="actionico">${icon('box')}</span><span><b>Закупка</b><small class="desc">Добавить телефон на склад</small></span><span class="chev">${icon('chevron')}</span></button><button class="typebtn" onclick="notice('Форма продажи подключится к складу.')"><span class="actionico blue">${icon('trend')}</span><span><b>Продажа</b><small class="desc">Закрыть сделку и записать прибыль</small></span><span class="chev">${icon('chevron')}</span></button><button class="typebtn" onclick="notice('Форму обмена добавим после финансовой логики.')"><span class="actionico violet">${icon('swap')}</span><span><b>Обмен</b><small class="desc">Обменять один телефон на другой</small></span><span class="chev">${icon('chevron')}</span></button><button class="typebtn" onclick="notice('Форма расходов появится в следующем этапе.')"><span class="actionico amber">${icon('expense')}</span><span><b>Расход</b><small class="desc">Доставка, ремонт, комиссия и другое</small></span><span class="chev">${icon('chevron')}</span></button>${section('История','Октябрь 2026')}<div class="rows">${row('trend','Продажа iPhone 15 Pro','14 октября · Продажа','+9 000 ₽')}${row('box','Закупка iPhone 13','13 октября · Закупка','−19 500 ₽',true)}</div><p class="note">История будет формироваться из реальных операций после подключения API.</p>`}function finance(){return `${heading('ДЕНЕЖНЫЙ ПОТОК','Финансы')}<div class="balance"><span>Общий денежный баланс</span><strong>142 300 ₽</strong><div class="split"><span>Наличные <b>52 300 ₽</b></span><span>Карта <b>90 000 ₽</b></span></div></div><div class="stats"><article class="stat"><span class="ico">${icon('box')}</span><label>Стоимость склада</label><strong>88 500 <small>₽</small></strong></article><article class="stat"><span class="ico blue">${icon('trend')}</span><label>Общий капитал</label><strong>230 800 <small>₽</small></strong></article></div>${section('Прибыль по месяцам','2026')}<div class="profit" style="display:flex;gap:20px;align-items:end;height:185px;justify-content:space-around">${[['Июл',42],['Авг',58],['Сен',70],['Окт',86]].map(([m,h])=>`<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:9px"><b style="font-size:11px;color:var(--mint);font-weight:600">${h}к</b><i style="height:${h}%;width:29px;border-radius:7px 7px 3px 3px;background:linear-gradient(#a6d9c9,#5e9e91);animation:grow .4s"></i><span class="muted">${m}</span></div>`).join('')}</div><p class="note">Все суммы на этом экране — пример оформления, не реальные данные.</p>`}function more(){return `${heading('ПРИЛОЖЕНИЕ','Ещё')}${[['finance','Счета и баланс','Наличные, карта и другие счета','blue'],['calendar','Напоминания','Склад, ремонт и контакты',''],['download','Экспорт данных','Выгрузка операций в CSV','violet'],['gear','Настройки учёта','Начальный баланс и параметры','amber']].map(x=>`<button class="setting" onclick="notice('Этот раздел подключим после основных операций.')"><span class="actionico ${x[3]}">${icon(x[0])}</span><span><b>${x[1]}</b><small>${x[2]}</small></span><span class="chev">${icon('chevron')}</span></button>`).join('')}<div class="morebrand">iPhone Business<br><br>Версия 0.2 · Визуальный прототип</div>`}function render(){document.getElementById('content').innerHTML=({'Главная':home,'Склад':stock,'Операции':operations,'Финансы':finance,'Ещё':more})[active]();document.getElementById('nav').innerHTML=tabs.map(([t,i])=>`<button class="${active===t?'active':''}" onclick="go('${t}')">${icon(i)}${t}</button>`).join('')}function go(t){active=t;query='';render();window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
